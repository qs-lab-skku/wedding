<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ivory:#f7f7f0;
  --cream:#eceedd;
  --gold:#5e7050;
  --gold2:#7d9068;
  --gold3:#b9c79c;
  --ink:#1b2114;
  --ink2:#38422c;
  --ink3:#6e7b5c;
  --border:#c8cfae;
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Serif KR',serif;background:var(--ivory);color:var(--ink);overflow-x:hidden}
body.zh{font-family:'Noto Serif SC','Noto Serif KR',serif}
button{font:inherit}

/* ── 상단 고정 버튼 (언어 · 돌아가기) ───────────── */
.pill{
  position:fixed;top:20px;z-index:50;
  display:flex;gap:2px;background:rgba(36,43,28,0.72);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:30px;padding:4px;
}
#lang-sw{left:20px}
#back-sw{right:20px}
.lbtn,#back{
  padding:5px 13px;border:none;background:transparent;
  color:rgba(255,255,255,0.6);font-size:0.7rem;letter-spacing:0.15em;
  cursor:pointer;border-radius:20px;font-family:'Cinzel',serif;
  transition:all 0.25s;text-decoration:none;white-space:nowrap;
}
#back{color:rgba(255,255,255,0.8);letter-spacing:0.08em;font-family:'Noto Serif KR',serif}
body.zh #back{font-family:'Noto Serif SC',serif}
.lbtn.active{background:var(--gold2);color:#fff}
.lbtn:hover,#back:hover{color:#fff}

/* ── 머리말 ─────────────────────────────────── */
.hero{text-align:center;padding:96px 24px 40px}
.h-kicker{font-family:'Cinzel',serif;font-size:0.68rem;letter-spacing:0.5em;color:var(--gold);text-transform:uppercase}
.h-title{font-family:'Cinzel',serif;font-weight:300;font-size:clamp(1.9rem,6.4vw,3rem);letter-spacing:0.12em;color:var(--ink);margin-top:14px;line-height:1.2}
.h-line{width:56px;height:1px;background:var(--gold2);margin:22px auto 18px;opacity:0.8}
.h-sub{font-size:0.86rem;color:var(--ink2);letter-spacing:0.06em;line-height:1.9;word-break:keep-all}
.h-count{margin-top:6px;font-family:'Cinzel',serif;font-size:0.76rem;letter-spacing:0.16em;color:var(--ink3)}
.h-hint{margin-top:16px;font-size:0.72rem;color:var(--ink3);opacity:0.8;word-break:keep-all}

/* ── 사진 그리드 ─────────────────────────────── */
.album{
  max-width:1200px;margin:0 auto;
  display:grid;grid-template-columns:repeat(3,1fr);gap:2px;
}
@media(min-width:640px){.album{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1000px){.album{grid-template-columns:repeat(5,1fr);padding:0 8px}}
.ai{
  position:relative;display:block;width:100%;aspect-ratio:3/4;
  overflow:hidden;border:none;padding:0;cursor:pointer;background:var(--cream);
}
.ai img{
  width:100%;height:100%;object-fit:cover;display:block;
  opacity:0;transition:opacity 0.5s ease,transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94);
}
.ai img.ld{opacity:1}
@media(hover:hover){.ai:hover img{transform:scale(1.05)}}
.ai:focus-visible{outline:2px solid var(--gold2);outline-offset:-2px}

/* ── 맨 위로 ─────────────────────────────────── */
#totop{
  position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:40;
  width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(36,43,28,0.72);color:#fff;font-size:1rem;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transform:translateY(8px);transition:all 0.3s;
}
#totop.show{opacity:0.85;pointer-events:auto;transform:none}

/* ── 라이트박스 ─────────────────────────────── */
#lightbox{
  display:none;position:fixed;inset:0;z-index:100;
  background:rgba(12,15,9,0.96);
  flex-direction:column;align-items:center;justify-content:center;padding:20px;
}
#lightbox.active{display:flex}
#lb-img{max-width:92vw;max-height:80vh;max-height:80svh;object-fit:contain;user-select:none;-webkit-user-select:none}
#lb-close{
  position:absolute;top:14px;right:16px;color:#fff;font-size:2rem;line-height:1;
  cursor:pointer;opacity:0.6;background:none;border:none;padding:8px 10px;font-family:sans-serif;
}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  color:#fff;font-size:2.4rem;cursor:pointer;opacity:0.45;
  background:none;border:none;padding:16px;font-family:sans-serif;
}
#lb-prev{left:4px}#lb-next{right:4px}
#lb-close:hover,.lb-nav:hover{opacity:1}
#lb-bar{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px}
#lb-count{color:rgba(255,255,255,0.45);font-size:0.72rem;letter-spacing:0.25em;font-family:'Cinzel',serif}
#lb-save{
  color:#fff;font-size:0.92rem;letter-spacing:0.1em;text-decoration:none;
  background:var(--gold2);border:none;border-radius:34px;padding:13px 20px;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-width:min(300px,76vw);cursor:pointer;
}
#lb-save:hover{background:var(--gold)}
#lb-save:active{transform:scale(0.97)}
#lb-save svg{width:17px;height:17px}
#lb-save.busy{opacity:0.6;pointer-events:none}

/* ── 길게 눌러 저장 안내 (위챗 등 인앱 브라우저용) ── */
#lp-ov{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(12,15,9,0.97);
  flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;
}
#lp-ov.active{display:flex}
#lp-img{max-width:88vw;max-height:70vh;max-height:70svh;object-fit:contain}
#lp-tip{
  color:#fff;font-size:0.95rem;letter-spacing:0.04em;text-align:center;line-height:1.7;
  background:var(--gold2);border-radius:30px;padding:10px 24px;word-break:keep-all;
}
#lp-close{
  position:absolute;top:14px;right:16px;color:#fff;font-size:2rem;line-height:1;
  cursor:pointer;opacity:0.7;background:none;border:none;padding:8px 10px;font-family:sans-serif;
}

footer{
  text-align:center;padding:48px 20px 64px;margin-top:40px;
  border-top:0.5px solid var(--border);
  font-family:'Cinzel',serif;font-size:0.82rem;color:var(--ink3);
  letter-spacing:0.22em;font-style:italic;
}

@media(max-width:600px){
  .pill{top:14px}

  #back-sw{right:14px}
  .hero{padding:84px 20px 32px}
  .lb-nav{padding:12px 8px;font-size:2rem}
}

const N = PHOTOS.length;
const thumb = p => 'photos/thumb/' + p + '.jpg';
const full  = p => 'photos/full/'  + p + '.jpg';

// ─── 언어 ─────────────────────────────────────
const T = {
  ko:{sub:'2026년 10월 3일 · 라까사호텔 광명', count:n=>`사진 ${n}장`, hint:'사진을 누르면 크게 볼 수 있어요', back:'← 돌아가기', save:'사진 저장', lp:'사진을 길게 눌러 저장하세요'},
  en:{sub:'October 3, 2026 · La Casa Hotel Gwangmyeong', count:n=>`${n} Photos`, hint:'Tap a photo to view it larger', back:'← Back', save:'Save Photo', lp:'Press and hold the photo to save it'},
  zh:{sub:'2026年10月3日 · 光明 La Casa 酒店', count:n=>`共 ${n} 张照片`, hint:'点击照片可查看大图', back:'← 返回', save:'保存照片', lp:'长按图片，选择「保存图片」'}
};
let lang = 'ko';
function setLang(l){
  if(!T[l]) l = 'ko';
  lang = l;
  const t = T[l];
  document.documentElement.lang = (l==='zh') ? 'zh-CN' : l;
  document.body.classList.toggle('zh', l==='zh');
  document.querySelectorAll('.lbtn').forEach(b => b.classList.toggle('active', b.dataset.l===l));
  document.getElementById('h-sub').textContent = t.sub;
  document.getElementById('h-count').textContent = t.count(N);
  document.getElementById('h-hint').textContent = t.hint;
  const back = document.getElementById('back');
  back.textContent = t.back;
  back.href = './?lang=' + l + '#gallery';
  document.getElementById('lb-save-t').textContent = t.save;
  document.getElementById('lp-tip').textContent = t.lp;
  try{ history.replaceState(history.state, '', '?lang=' + l + location.hash); }catch(e){}
}
// 같은 사이트에서 왔으면 뒤로 가기(스크롤 위치 유지), 아니면 메인으로 이동
document.getElementById('back').addEventListener('click', e => {
  try{
    const r = document.referrer ? new URL(document.referrer) : null;
    if(r && r.origin === location.origin && !/album\.html$/.test(r.pathname) && history.length > 1){
      e.preventDefault(); history.back();
    }
  }catch(err){}
});

// ─── 그리드 ───────────────────────────────────
(function(){
  const grid = document.getElementById('album');
  const frag = document.createDocumentFragment();
  PHOTOS.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'ai'; b.type = 'button';
    b.setAttribute('aria-label', (i+1) + ' / ' + N);
    const img = document.createElement('img');
    img.loading = 'lazy'; img.decoding = 'async'; img.alt = '';
    img.addEventListener('load', () => img.classList.add('ld'));
    img.src = thumb(p);
    b.appendChild(img);
    b.addEventListener('click', () => openLb(i));
    frag.appendChild(b);
  });
  grid.appendChild(frag);
})();

// ─── 라이트박스 ───────────────────────────────
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
let idx = 0, lbOpen = false;
const cache = {};
function preload(i){
  i = (i + N) % N;
  if(!cache[i]){ const im = new Image(); im.src = full(PHOTOS[i]); cache[i] = im; }
}
function show(i){
  idx = (i + N) % N;
  const p = PHOTOS[idx];
  const want = full(p);
  const ready = cache[idx] && cache[idx].complete && cache[idx].naturalWidth;
  lbImg.src = ready ? want : thumb(p);          // 썸네일 먼저 → 원본 로드되면 교체
  if(!ready){
    preload(idx);
    const im = cache[idx], my = idx;
    im.addEventListener('load', () => { if(idx === my && lbOpen) lbImg.src = want; }, {once:true});
  }
  document.getElementById('lb-count').textContent = `${idx+1} / ${N}`;
  const s = document.getElementById('lb-save');
  s.href = want;
  s.setAttribute('download', 'SeungukBrook_' + String(idx+1).padStart(3,'0') + '.jpg');
  preload(idx + 1); preload(idx - 1);
}
function openLb(i){
  show(i);
  if(!lbOpen){
    lbOpen = true;
    lb.classList.add('active');
    document.body.style.overflow = 'hidden';
    try{ history.pushState({lb:1}, ''); }catch(e){}
  }
}
function hideLb(){
  lbOpen = false;
  lb.classList.remove('active');
  document.body.style.overflow = '';
}
function closeLb(){
  if(!lbOpen) return;
  if(history.state && history.state.lb){ history.back(); }   // popstate에서 닫힘
  else hideLb();
}
window.addEventListener('popstate', () => { if(lbOpen) hideLb(); });
document.getElementById('lb-close').addEventListener('click', closeLb);

// "길게 눌러 저장" 안내로 전환, 그 외 모바일은 공유 시트(갤러리 저장),
// 데스크톱 등은 blob 다운로드로 처리
const UA = navigator.userAgent;
const IN_APP = /MicroMessenger|WeChat|Weibo|QQ\//i.test(UA) || (/QQBrowser|UCBrowser|Quark|baiduboxapp/i.test(UA) && /Android/i.test(UA));
const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(UA);
const lpOv = document.getElementById('lp-ov');
function showLp(url){
  document.getElementById('lp-img').src = url;
  lpOv.classList.add('active');
}
function hideLp(){ lpOv.classList.remove('active'); }
document.getElementById('lp-close').addEventListener('click', hideLp);
lpOv.addEventListener('click', e => { if(e.target === lpOv) hideLp(); });

const saveBtn = document.getElementById('lb-save');
saveBtn.addEventListener('click', async e => {
  e.preventDefault(); e.stopPropagation();
  const url = full(PHOTOS[idx]);
  const name = saveBtn.getAttribute('download') || 'photo.jpg';
  if(IN_APP){ showLp(url); return; }
  saveBtn.classList.add('busy');
  try{
    if(IS_MOBILE && navigator.share && navigator.canShare){
      const blob = await (await fetch(url)).blob();
      const file = new File([blob], name, {type:'image/jpeg'});
      if(navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file]}); return; }
        catch(err){ if(err && err.name === 'AbortError') return; }
      }
    }
    const blob = await (await fetch(url)).blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }catch(err){
    showLp(url);                 // 마지막 수단: 길게 눌러 저장 안내
  }finally{
    saveBtn.classList.remove('busy');
  }
});
document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); show(idx - 1); });
document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); show(idx + 1); });
lb.addEventListener('click', e => { if(e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && lpOv.classList.contains('active')){ hideLp(); return; }
  if(!lbOpen) return;
  if(e.key === 'Escape') closeLb();
  if(e.key === 'ArrowLeft') show(idx - 1);
  if(e.key === 'ArrowRight') show(idx + 1);
});
// 좌우로 밀어서 넘기기
(function(){
  let sx = 0, sy = 0, on = false;
  lb.addEventListener('touchstart', e => {
    if(e.touches.length !== 1){ on = false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; on = true;
  }, {passive:true});
  lb.addEventListener('touchend', e => {
    if(!on) return; on = false;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) show(idx + (dx < 0 ? 1 : -1));
  }, {passive:true});
})();

// ─── 맨 위로 ──────────────────────────────────
(function(){
  const btn = document.getElementById('totop');
  const onScroll = () => btn.classList.toggle('show', window.scrollY > window.innerHeight * 1.5);
  window.addEventListener('scroll', onScroll, {passive:true});
  btn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
  onScroll();
})();

// 언어 결정: URL ?lang= 우선, 없으면 브라우저 언어
(function(){
  const q = new URLSearchParams(location.search).get('lang');
  if(q === 'ko' || q === 'en' || q === 'zh'){ setLang(q); return; }
  const l = (navigator.language || 'ko').toLowerCase();
  setLang(l.startsWith('zh') ? 'zh' : l.startsWith('ko') ? 'ko' : 'en');
})();
</script>
